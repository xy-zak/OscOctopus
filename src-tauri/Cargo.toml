[package]
name = "osc-octopus"
version = "0.1.0"
description = "Flexible OSC control desk"
authors = ["OscOctopus contributors"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "osc_octopus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
rosc = "0.11"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"
thiserror = "2"
ts-rs = "12"
log = "0.4"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
